name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node build.js
      - run: diff -q dist/index.html docs/index.html || (echo "docs/index.html is stale: run npm run build and commit" && exit 1)
